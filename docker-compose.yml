name: fraud-airflow-csv

x-airflow: &airflow
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: fraud-airflow-local:1
  user: "50000:0"
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: local-educational-fraud-airflow
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__CORE__PARALLELISM: "4"
    SHARED_DIR: /shared
    BATCH_SIZE: ${BATCH_SIZE:-2000}
  volumes:
    - shared:/shared
    - airflow_logs:/opt/airflow/logs
  depends_on:
    airflow-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  volume-init:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-c", "chown 50000:0 /shared /logs && chmod 775 /shared /logs"]
    volumes:
      - shared:/shared
      - airflow_logs:/logs
    restart: "no"

  postgres:
    image: postgres:15.10-bookworm
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zk_data:/var/lib/zookeeper/data
      - zk_log:/var/lib/zookeeper/log
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in transactions scoring scoring_errors; do
          kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions 1 --replication-factor 1
        done
    restart: "no"

  data-init:
    build: .
    image: fraud-runtime-local:1
    command: ["python", "-m", "fraud_pipeline.bootstrap"]
    environment:
      SHARED_DIR: /shared
      TRAIN_DATA_CSV: /input/train.csv
      WINDOW_MONTHS: ${WINDOW_MONTHS:-3}
      HISTORY_MONTHS: ${HISTORY_MONTHS:-36}
    volumes:
      - shared:/shared
      - ./data:/input:ro
    depends_on:
      volume-init:
        condition: service_completed_successfully
    restart: "no"

  airflow-init:
    <<: *airflow
    environment:
      <<: *airflow-env
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        airflow db migrate
        if ! airflow users list --output json | python -c 'import json,os,sys; sys.exit(0 if any(u["username"]==os.environ["_AIRFLOW_WWW_USER_USERNAME"] for u in json.load(sys.stdin)) else 1)'; then
          airflow users create --username "$${_AIRFLOW_WWW_USER_USERNAME}" --password "$${_AIRFLOW_WWW_USER_PASSWORD}" --firstname Demo --lastname Admin --role Admin --email admin@example.local
        fi
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
      volume-init:
        condition: service_completed_successfully
    restart: "no"

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  scorer:
    build: .
    image: fraud-runtime-local:1
    environment:
      SHARED_DIR: /shared
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TRANSACTIONS_CSV: /input/test.csv
    volumes:
      - shared:/shared
      - ./data:/input:ro
    depends_on:
      data-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  simulator:
    build: .
    image: fraud-runtime-local:1
    command: ["python", "-m", "fraud_pipeline.stream", "simulator"]
    environment:
      SHARED_DIR: /shared
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TRANSACTIONS_CSV: /input/test.csv
    volumes:
      - shared:/shared
      - ./data:/input:ro
    depends_on:
      data-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  reports:
    image: python:3.11.11-slim-bookworm
    user: "50000:0"
    command: ["python", "-m", "http.server", "8000", "--directory", "/shared/reports"]
    volumes:
      - shared:/shared:ro
    ports:
      - "127.0.0.1:8082:8000"
    depends_on:
      data-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  shared:
  airflow_logs:
  postgres_data:
  kafka_data:
  zk_data:
  zk_log:
